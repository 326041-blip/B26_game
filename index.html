        }<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Web Puyo Clone</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=M+PLUS+Rounded+1c:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: 'Fredoka One', 'M PLUS Rounded 1c', cursive;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .header {
            text-align: center;
            margin: 10px 0;
        }

        .title {
            font-size: 2rem;
            margin: 0;
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.8), 0 0 20px #00e5ff, 0 0 30px #00e5ff;
            animation: float 3s ease-in-out infinite;
            letter-spacing: 2px;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }

        .game-wrapper {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        /* サイドバー（スコアとNEXT） */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .panel h3 {
            margin: 0 0 10px 0;
            font-size: 1.2rem;
            color: #ffeb3b;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        #score-val {
            font-size: 1.8rem;
            margin: 0;
            font-weight: bold;
        }

        #next-canvas {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        /* メインボード */
        .main-board {
            position: relative;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,229,255,0.4), inset 0 0 20px rgba(0,0,0,0.8);
            padding: 5px;
        }

        #game-canvas {
            display: block;
            border-radius: 5px;
            background: rgba(0,0,0,0.2);
        }

        /* 操作パネル (モバイル対応) */
        .controls-wrapper {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 350px;
            padding: 10px;
        }

        .control-row {
            display: flex;
            justify-content: space-around;
            width: 100%;
        }

        .btn {
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            color: white;
            font-size: 1.5rem;
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.1s ease;
        }
        
        .btn:active, .btn.active {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0.9);
            box-shadow: 0 0 15px #00e5ff;
            border-color: #00e5ff;
        }

        .btn-wide {
            border-radius: 30px;
            width: 100px;
            font-weight: bold;
            font-family: inherit;
            font-size: 1.2rem;
        }

        /* ゲームオーバーモーダル */
        #game-over-modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            border-radius: 10px;
        }

        #game-over-modal h2 {
            font-size: 3rem;
            color: #ff3366;
            text-shadow: 0 0 20px #ff3366;
            margin-bottom: 20px;
        }

        .retry-btn {
            background: linear-gradient(135deg, #00e5ff, #0077ff);
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            color: white;
            border-radius: 30px;
            cursor: pointer;
            font-family: inherit;
            box-shadow: 0 4px 15px rgba(0, 229, 255, 0.5);
            transition: transform 0.2s;
        }
        .retry-btn:hover {
            transform: scale(1.05);
        }

        @media (max-height: 700px) {
            .title { font-size: 1.5rem; }
            .btn { width: 50px; height: 50px; font-size: 1.2rem; }
            .btn-wide { width: 80px; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 class="title">PUYO WEB</h1>
    </div>

    <div class="game-wrapper">
        <div class="sidebar">
            <div class="panel">
                <h3>SCORE</h3>
                <p id="score-val">0</p>
            </div>
            <div class="panel">
                <h3>NEXT</h3>
                <canvas id="next-canvas" width="80" height="180"></canvas>
            </div>
        </div>

        <div class="main-board">
            <canvas id="game-canvas" width="240" height="520"></canvas>
            <div id="game-over-modal">
                <h2>GAME OVER</h2>
                <button class="retry-btn" onclick="initGame()">RETRY</button>
            </div>
        </div>
    </div>

    <div class="controls-wrapper">
        <div class="control-row">
            <button class="btn btn-wide" id="btn-rot-l">左回転 ↺</button>
            <button class="btn btn-wide" id="btn-rot-r">↻ 右回転</button>
        </div>
        <div class="control-row">
            <button class="btn" id="btn-left">◀</button>
            <button class="btn" id="btn-down">▼</button>
            <button class="btn" id="btn-right">▶</button>
        </div>
    </div>

    <script>
        // --- 設定・定数 ---
        const COLS = 6;
        const ROWS = 13;
        const TILE_SIZE = 40;
        
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const nextCanvas = document.getElementById('next-canvas');
        const nextCtx = nextCanvas.getContext('2d');
        
        // 色設定 (グラデーションとハイライト)
        const COLORS = {
            1: { base: '#FF3366', light: '#ff99b3' }, // 赤
            2: { base: '#33CCFF', light: '#99e5ff' }, // 青
            3: { base: '#33FF66', light: '#99ffb3' }, // 緑
            4: { base: '#FFCC00', light: '#ffe680' }, // 黄
            5: { base: '#CC33FF', light: '#e699ff' }  // 紫
        };

        // --- ゲーム状態管理 ---
        let board = [];
        let nextQueue = [];
        let score = 0;
        let chainCount = 0;
        
        let activePuyo = null;
        let fallingPuyos = [];
        
        let gameState = 'PLAYING'; // PLAYING, DROPPING, MATCHING, EFFECT, GAMEOVER
        let effectTimer = 0;
        
        const NORMAL_SPEED = 0.03; // 1フレームあたりの落下量(マス)
        const FAST_SPEED = 0.4;
        let currentSpeed = NORMAL_SPEED;

        let particles = [];
        let popupTexts = [];

        // --- 初期化 ---
        function initGame() {
            board = Array.from({length: ROWS}, () => Array(COLS).fill(0));
            score = 0;
            chainCount = 0;
            updateScoreDisplay();
            document.getElementById('game-over-modal').style.display = 'none';
            
            // NEXTキューの初期化 (2手先まで)
            nextQueue = [
                [getRandomColor(), getRandomColor()],
                [getRandomColor(), getRandomColor()]
            ];
            
            particles = [];
            popupTexts = [];
            
            spawnNext();
            requestAnimationFrame(gameLoop);
        }

        function getRandomColor() {
            return Math.floor(Math.random() * 5) + 1;
        }

        function spawnNext() {
            activePuyo = {
                x: 2, y: 0,
                color1: nextQueue[0][0], // 軸（下）
                color2: nextQueue[0][1], // 従（上）
                rot: 0 // 0:上, 1:右, 2:下, 3:左
            };
            
            nextQueue.shift();
            nextQueue.push([getRandomColor(), getRandomColor()]);
            drawNext();
            
            currentSpeed = NORMAL_SPEED;
            
            // 出現位置が埋まっていたらゲームオーバー
            if (board[0][2] !== 0 || board[1][2] !== 0) {
                gameState = 'GAMEOVER';
                document.getElementById('game-over-modal').style.display = 'flex';
                return;
            }
            
            gameState = 'PLAYING';
        }

        function drawNext() {
            nextCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
            // Next 1
            drawSinglePuyo(nextCtx, 1, 1, nextQueue[0][1]);
            drawSinglePuyo(nextCtx, 1, 2, nextQueue[0][0]);
            // Next 2 (少し小さく表示)
            nextCtx.save();
            nextCtx.scale(0.7, 0.7);
            drawSinglePuyo(nextCtx, 1, 4.5, nextQueue[1][1]);
            drawSinglePuyo(nextCtx, 1, 5.5, nextQueue[1][0]);
            nextCtx.restore();
        }

        // --- 描画関数 ---
        function drawSinglePuyo(context, gridX, gridY, colorId, scale = 1, alpha = 1, connections = null) {
            if (colorId === 0) return;
            
            const px = gridX * TILE_SIZE + TILE_SIZE/2;
            const py = gridY * TILE_SIZE + TILE_SIZE/2;
            const col = COLORS[colorId];
            
            context.save();
            context.translate(px, py);
            context.scale(scale, scale);
            context.globalAlpha = alpha;
            
            // ベース描画（繋がりがある場合は形を変える）
            context.beginPath();
            context.arc(0, 0, TILE_SIZE/2 - 2, 0, Math.PI * 2);
            
            if (connections) {
                if (connections.top) context.rect(-TILE_SIZE/2 + 2, -TILE_SIZE/2, TILE_SIZE - 4, TILE_SIZE/2);
                if (connections.bottom) context.rect(-TILE_SIZE/2 + 2, 0, TILE_SIZE - 4, TILE_SIZE/2);
                if (connections.left) context.rect(-TILE_SIZE/2, -TILE_SIZE/2 + 2, TILE_SIZE/2, TILE_SIZE - 4);
                if (connections.right) context.rect(0, -TILE_SIZE/2 + 2, TILE_SIZE/2, TILE_SIZE - 4);
            }
            
            // 立体的なグラデーション
            const grad = context.createRadialGradient(-6, -6, 2, 0, 0, TILE_SIZE/2);
            grad.addColorStop(0, col.light);
            grad.addColorStop(1, col.base);
            
            context.fillStyle = grad;
            context.fill();
            context.closePath();
            
            // 目玉を描画してキャラクターっぽく
            context.fillStyle = 'white';
            context.beginPath(); context.arc(-6, -8, 5, 0, Math.PI*2); context.fill();
            context.beginPath(); context.arc(6, -8, 5, 0, Math.PI*2); context.fill();
            context.fillStyle = 'black';
            context.beginPath(); context.arc(-6, -8, 2, 0, Math.PI*2); context.fill();
            context.beginPath(); context.arc(6, -8, 2, 0, Math.PI*2); context.fill();
            
            // 光沢
            context.fillStyle = 'rgba(255,255,255,0.4)';
            context.beginPath(); context.arc(-10, -12, 3, 0, Math.PI*2); context.fill();
            
            context.restore();
        }

        // --- ロジック ---
        function getSubPos(puyo) {
            let dx = 0, dy = 0;
            if (puyo.rot === 0) dy = -1;
            if (puyo.rot === 1) dx = 1;
            if (puyo.rot === 2) dy = 1;
            if (puyo.rot === 3) dx = -1;
            return { x: puyo.x + dx, y: puyo.y + dy };
        }

        function checkCollision(x, y) {
            // yは小数点になり得るため、着地判定用に切り捨てる
            let checkY = Math.floor(y);
            if (x < 0 || x >= COLS) return true;
            if (checkY >= ROWS) return true;
            if (checkY >= 0 && board[checkY][x] !== 0) return true;
            return false;
        }

        function isBlockedAtFloor(x, y) {
            let checkY = Math.floor(y + 0.9); // 下への当たり判定は少し厳しめに
            if (checkY >= ROWS) return true;
            if (checkY >= 0 && board[checkY][x] !== 0) return true;
            return false;
        }

        function moveHorizontal(dx) {
            if (gameState !== 'PLAYING') return;
            let sub = getSubPos(activePuyo);
            
            // 移動先が空いているか
            if (!checkCollision(activePuyo.x + dx, activePuyo.y) && 
                !checkCollision(sub.x + dx, sub.y)) {
                activePuyo.x += dx;
            }
        }

        function rotateActive(dir) { // 1: 右, -1: 左
            if (gameState !== 'PLAYING') return;
            let origRot = activePuyo.rot;
            let newRot = (activePuyo.rot + dir + 4) % 4;
            activePuyo.rot = newRot;
            
            let sub = getSubPos(activePuyo);
            
            // 衝突する場合は壁蹴り（1マス横にずらす）を試みる
            if (checkCollision(sub.x, sub.y)) {
                // 左にずらしてみる
                if (!checkCollision(activePuyo.x - 1, activePuyo.y) && 
                    !checkCollision(sub.x - 1, sub.y)) {
                    activePuyo.x -= 1;
                } 
                // 右にずらしてみる
                else if (!checkCollision(activePuyo.x + 1, activePuyo.y) && 
                         !checkCollision(sub.x + 1, sub.y)) {
                    activePuyo.x += 1;
                } 
                // どちらもダメなら回転キャンセル
                else {
                    activePuyo.rot = origRot;
                }
            }
        }

        // --- 落下と固定処理 ---
        function fixToBoardAndDrop() {
            let sub = getSubPos(activePuyo);
            
            // 座標を整数化してボードに配置
            let ax = activePuyo.x;
            let ay = Math.floor(activePuyo.y);
            let sx = sub.x;
            let sy = Math.floor(sub.y);
            
            if (ay >= 0) board[ay][ax] = activePuyo.color1;
            if (sy >= 0) board[sy][sx] = activePuyo.color2;
            
            startDropping();
        }

        function startDropping() {
            fallingPuyos = [];
            // 下からスキャンして宙に浮いているぷよを探す
            for (let x = 0; x < COLS; x++) {
                let emptySpaces = 0;
                for (let y = ROWS - 1; y >= 0; y--) {
                    if (board[y][x] === 0) {
                        emptySpaces++;
                    } else if (emptySpaces > 0) {
                        // 浮いているので落下リストへ
                        fallingPuyos.push({
                            x: x,
                            y: y, // 現在のY (アニメーション用)
                            targetY: y + emptySpaces, // 落ちる先のY
                            color: board[y][x]
                        });
                        board[y][x] = 0; // 一旦盤面から消す
                    }
                }
            }
            
            if (fallingPuyos.length > 0) {
                gameState = 'DROPPING';
            } else {
                checkMatches();
            }
        }

        // --- マッチング（消滅）処理 ---
        function checkMatches() {
            let visited = Array.from({length: ROWS}, () => Array(COLS).fill(false));
            let groups = [];
            
            // BFSで同色の繋がりを探索
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    if (board[y][x] !== 0 && !visited[y][x]) {
                        let color = board[y][x];
                        let group = [];
                        let stack = [{x, y}];
                        visited[y][x] = true;
                        
                        while(stack.length > 0) {
                            let curr = stack.pop();
                            group.push(curr);
                            
                            const dirs = [[0,1],[1,0],[0,-1],[-1,0]];
                            for (let d of dirs) {
                                let nx = curr.x + d[0];
                                let ny = curr.y + d[1];
                                if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS) {
                                    if (!visited[ny][nx] && board[ny][nx] === color) {
                                        visited[ny][nx] = true;
                                        stack.push({x: nx, y: ny});
                                    }
                                }
                            }
                        }
                        // 4つ以上繋がっていたら消滅グループへ
                        if (group.length >= 4) {
                            groups.push(group);
                        }
                    }
                }
            }
            
            if (groups.length > 0) {
                chainCount++;
                let firstPos = null; // 連鎖テキスト表示用
                
                for (let g of groups) {
                    if(!firstPos) firstPos = g[0];
                    for (let p of g) {
                        spawnParticles(p.x, p.y, COLORS[board[p.y][p.x]].base);
                        board[p.y][p.x] = 0; // ボードから消去
                    }
                }
                
                // スコア計算 (繋がった数×連鎖数ボーナス)
                let basePoints = groups.reduce((sum, g) => sum + (g.length * 10), 0);
                score += basePoints * chainCount * 10;
                updateScoreDisplay();
                
                popupTexts.push({
                    text: chainCount + " 連鎖!!",
                    x: firstPos.x * TILE_SIZE,
                    y: firstPos.y * TILE_SIZE,
                    life: 1.0
                });
                
                gameState = 'EFFECT';
                effectTimer = 45; // 約0.7秒待機
            } else {
                // 消えるものがなければ次のぷよへ
                chainCount = 0;
                spawnNext();
            }
        }

        function updateScoreDisplay() {
            document.getElementById('score-val').innerText = score;
        }

        // --- エフェクト ---
        function spawnParticles(x, y, colorHex) {
            for(let i = 0; i < 20; i++){
                particles.push({
                    x: x * TILE_SIZE + TILE_SIZE/2,
                    y: y * TILE_SIZE + TILE_SIZE/2,
                    vx: (Math.random() - 0.5) * 15,
                    vy: (Math.random() - 0.5) * 15 - 2, // 少し上方向に飛ばす
                    life: 1.0,
                    color: colorHex
                });
            }
        }

        // --- メインループ ---
        function gameLoop() {
            if (gameState === 'GAMEOVER') return;
            
            update();
            render();
            
            requestAnimationFrame(gameLoop);
        }

        function update() {
            if (gameState === 'PLAYING') {
                // プレイヤー操作中の落下
                activePuyo.y += currentSpeed;
                let sub = getSubPos(activePuyo);
                
                // 床やブロックへの着地判定
                if (isBlockedAtFloor(activePuyo.x, activePuyo.y) || 
                    isBlockedAtFloor(sub.x, sub.y)) {
                    
                    // めり込まないように位置を戻す
                    activePuyo.y = Math.floor(activePuyo.y);
                    fixToBoardAndDrop();
                }
            } 
            else if (gameState === 'DROPPING') {
                // 自由落下中のぷよのアニメーション
                let isStillDropping = false;
                for (let p of fallingPuyos) {
                    if (p.y < p.targetY) {
                        p.y += 0.4; // 落下速度
                        isStillDropping = true;
                        if (p.y >= p.targetY) {
                            p.y = p.targetY;
                            board[p.targetY][p.x] = p.color; // 固定
                        }
                    }
                }
                if (!isStillDropping) {
                    checkMatches();
                }
            }
            else if (gameState === 'EFFECT') {
                // 消滅エフェクト待機
                effectTimer--;
                if (effectTimer <= 0) {
                    startDropping(); // 空いた空間を埋めるため再度落下処理へ
                }
            }

            // パーティクル更新
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.5; // 重力
                p.life -= 0.03;
                if (p.life <= 0) particles.splice(i, 1);
            }

            // テキストポップアップ更新
            for (let i = popupTexts.length - 1; i >= 0; i--) {
                let pt = popupTexts[i];
                pt.y -= 1; // 上へ昇る
                pt.life -= 0.015;
                if (pt.life <= 0) popupTexts.splice(i, 1);
            }
        }

        function render() {
            // 背景クリア
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // グリッド線（薄く）
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 1;
            for(let i=0; i<=COLS; i++) { ctx.beginPath(); ctx.moveTo(i*TILE_SIZE, 0); ctx.lineTo(i*TILE_SIZE, canvas.height); ctx.stroke(); }
            for(let i=0; i<=ROWS; i++) { ctx.beginPath(); ctx.moveTo(0, i*TILE_SIZE); ctx.lineTo(canvas.width, i*TILE_SIZE); ctx.stroke(); }
            
            // デッドライン（×印を薄く表示）
            ctx.fillStyle = 'rgba(255, 0, 0, 0.2)';
            ctx.font = '24px Arial';
            ctx.fillText('✕', 2 * TILE_SIZE + 10, 0 * TILE_SIZE + 28);
            ctx.fillText('✕', 2 * TILE_SIZE + 10, 1 * TILE_SIZE + 28);

            // ボードに固定されたぷよの描画
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    if (board[y][x] !== 0) {
                        // 上下左右が同じ色かチェックして形状を変える
                        let col = board[y][x];
                        let conns = {
                            top: y > 0 && board[y-1][x] === col,
                            bottom: y < ROWS-1 && board[y+1][x] === col,
                            left: x > 0 && board[y][x-1] === col,
                            right: x < COLS-1 && board[y][x+1] === col
                        };
                        drawSinglePuyo(ctx, x, y, col, 1, 1, conns);
                    }
                }
            }

            // 自由落下中のぷよの描画
            if (gameState === 'DROPPING') {
                for (let p of fallingPuyos) {
                    if (p.y < p.targetY) {
                        drawSinglePuyo(ctx, p.x, p.y, p.color);
                    }
                }
            }

            // 操作中のぷよの描画
            if (gameState === 'PLAYING' && activePuyo) {
                let sub = getSubPos(activePuyo);
                drawSinglePuyo(ctx, activePuyo.x, activePuyo.y, activePuyo.color1);
                drawSinglePuyo(ctx, sub.x, sub.y, activePuyo.color2);
            }

            // パーティクルの描画
            for (let p of particles) {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life;
                ctx.beginPath();
                ctx.arc(p.x, p.y, Math.random()*3 + 3, 0, Math.PI*2);
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;

            // テキストの描画
            ctx.textAlign = 'center';
            ctx.font = 'bold 24px "Fredoka One", sans-serif';
            for (let pt of popupTexts) {
                ctx.globalAlpha = pt.life;
                ctx.fillStyle = '#FFD700'; // ゴールド
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 4;
                ctx.strokeText(pt.text, pt.x + TILE_SIZE, pt.y);
                ctx.fillText(pt.text, pt.x + TILE_SIZE, pt.y);
            }
            ctx.globalAlpha = 1.0;
        }

        // --- 入力制御 ---
        document.addEventListener('keydown', (e) => {
            if (gameState !== 'PLAYING') return;
            if (e.key === 'ArrowLeft') moveHorizontal(-1);
            if (e.key === 'ArrowRight') moveHorizontal(1);
            if (e.key === 'ArrowDown') currentSpeed = FAST_SPEED;
            if (e.key === 'z' || e.key === 'Z') rotateActive(-1);
            if (e.key === 'x' || e.key === 'X' || e.key === 'ArrowUp') rotateActive(1);
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowDown') currentSpeed = NORMAL_SPEED;
        });

        // モバイル・マウス用のボタン制御
        function bindButton(id, onDown, onUp) {
            const btn = document.getElementById(id);
            const downHandler = (e) => { e.preventDefault(); btn.classList.add('active'); onDown(); };
            const upHandler = (e) => { e.preventDefault(); btn.classList.remove('active'); if(onUp) onUp(); };
            
            btn.addEventListener('mousedown', downHandler);
            btn.addEventListener('touchstart', downHandler, {passive: false});
            btn.addEventListener('mouseup', upHandler);
            btn.addEventListener('mouseleave', upHandler);
            btn.addEventListener('touchend', upHandler, {passive: false});
        }

        bindButton('btn-left', () => moveHorizontal(-1));
        bindButton('btn-right', () => moveHorizontal(1));
        bindButton('btn-down', () => { currentSpeed = FAST_SPEED; }, () => { currentSpeed = NORMAL_SPEED; });
        bindButton('btn-rot-l', () => rotateActive(-1));
        bindButton('btn-rot-r', () => rotateActive(1));

        // ゲーム開始
        window.onload = () => {
            initGame();
        };

    </script>
</body>
</html>
